apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: muchtodo
spec:
  selector:
    app: mongodb      # Routes traffic to pods with this label
  ports:
    - protocol: TCP
      port: 27017       # Port the Service listens on
      targetPort: 27017 # Port on the pod to forward to
  type: ClusterIP       # Only accessible inside the cluster (not externally)