apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: muchtodo
spec:
  type: NodePort        # Exposes a port on every node in the cluster
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080          # Internal cluster port
      targetPort: 8080    # Port on the pod
      nodePort: 30080     # Port exposed on localhost (30000-32767 range)