services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: much_todo_db

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend


  redis:
    image: redis:7.2
    container_name: redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    volumes:
      - redis_data:/data

    networks:
      - backend


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: muchtodo-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_URI: mongodb://root:example@mongodb:27017/much_todo_db?authSource=admin
      DB_NAME: much_todo_db

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ADDR: redis:6379

      PORT: 8080

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend


volumes:
  mongo_data:
  redis_data:


networks:
  backend:
    driver: bridge